<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Nestly{% endblock %} | Nestly</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#f4f1ea;--card:#fcfaf5;--line:#e1dac8;--ink:#26312d;--ink2:#55615b;--deep:#2f5444;--sagebg:#dfeadf;--serif:'Fraunces',Georgia,serif;--sans:'Plus Jakarta Sans',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6}
.box{max-width:460px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:2.4rem 1.8rem}
.ic{width:84px;height:84px;border-radius:26px;background:var(--sagebg);color:var(--deep);display:grid;place-items:center;font-size:2rem;margin:0 auto 1.3rem}
h1{font:600 1.9rem var(--serif);margin:0 0 .5rem}
p{color:var(--ink2);margin:0 0 1.6rem}
a.btn{display:inline-flex;gap:.6rem;align-items:center;padding:.85rem 1.5rem;border-radius:999px;background:var(--deep);color:#fff;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <div class="ic"><i class="fa-solid {% block icon %}fa-circle-exclamation{% endblock %}"></i></div>
  <h1>{% block heading %}Something went wrong{% endblock %}</h1>
  <p>{% block text %}Please try again.{% endblock %}</p>
  <a class="btn" href="/"><i class="fa-solid fa-house"></i> Back to home</a>
</div>
</body>
</html>
